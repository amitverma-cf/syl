[package]
name = "syl"
version.workspace = true
description = "syl — local-first agentic GUI app"
authors = ["Amit Verma"]
edition.workspace = true
license.workspace = true

[lib]
name = "syl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde.workspace = true
serde_json.workspace = true
syl-core.workspace = true
cloud-providers.workspace = true
native-engines.workspace = true
memory.workspace = true
tools.workspace = true
flow-engine.workspace = true
daemon.workspace = true
extension-registry.workspace = true
extension-host.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
tokio.workspace = true
async-trait = "0.1"
sysinfo.workspace = true
tauri-plugin-autostart.workspace = true
tokio-cron-scheduler.workspace = true
uuid.workspace = true
base64.workspace = true
cpal.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
