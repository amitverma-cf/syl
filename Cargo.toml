[workspace]
resolver = "2"
members = [
    "crates/core-types",
    "crates/provider",
    "crates/engine-host",
    "crates/memory",
    "crates/tool",
    "crates/executor",
    "crates/daemon",
    "crates/plugin-registry",
    "crates/extension-host",
    "crates/engine-worker",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/amve/syl"

[workspace.dependencies]
core-types = { path = "crates/core-types" }
provider = { path = "crates/provider" }
engine-host = { path = "crates/engine-host" }
memory = { path = "crates/memory" }
tool = { path = "crates/tool" }
executor = { path = "crates/executor" }
daemon = { path = "crates/daemon" }
plugin-registry = { path = "crates/plugin-registry" }
extension-host = { path = "crates/extension-host" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "fs"] }
thiserror = "1"
libloading = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
rusqlite = { version = "0.31", features = ["bundled"] }
ureq = { version = "2", features = ["tls"] }
sysinfo = "0.32"
jsonschema = { version = "0.49", default-features = false }
tokio-cron-scheduler = "0.15"
uuid = { version = "1", features = ["v4", "serde"] }
tauri-plugin-autostart = "2.5"
genai = { version = "0.6", default-features = false, features = ["rustls-tls"] }
futures-util = "0.3"
rmcp = { version = "2.2", default-features = false, features = ["client", "transport-child-process", "transport-io", "transport-streamable-http-client", "transport-streamable-http-client-reqwest", "reqwest"] }
png = "0.17"
base64 = "0.22"
ort = { version = "2.0.0-rc.12", default-features = false, features = ["load-dynamic"] }
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
rustfft = "6"
cpal = "0.15"
hound = "3"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
